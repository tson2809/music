<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <i class="fa-solid fa-music music-icon"></i>
      </div>
      <h1>Music Stream</h1>
      <p class="subtitle">Đăng nhập để tiếp tục</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Nhập tên đăng nhập"
            [class.error]="username?.invalid && username?.touched"
          />
        </div>
        <div class="error-message" *ngIf="username?.invalid && username?.touched">
          <span *ngIf="username?.errors?.['required']">Vui lòng nhập tên đăng nhập</span>
          <span *ngIf="username?.errors?.['minlength']">Tên đăng nhập phải có ít nhất 3 ký tự</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Nhập mật khẩu"
            [class.error]="password?.invalid && password?.touched"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            <i *ngIf="!showPassword" class="fa-solid fa-eye"></i>
            <i *ngIf="showPassword" class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
        <div class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Vui lòng nhập mật khẩu</span>
          <span *ngIf="password?.errors?.['minlength']">Mật khẩu phải có ít nhất 6 ký tự</span>
        </div>
      </div>

      <div class="error-message server-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="login-button" [disabled]="loading">
        <span *ngIf="!loading">Đăng nhập</span>
        <span *ngIf="loading" class="loading-spinner">
          <i class="fa-solid fa-spinner fa-spin spinner"></i>
          Đang đăng nhập...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p><a routerLink="/forgot-password">Quên mật khẩu?</a></p>
    </div>
  </div>

</div>
